name: Publish on main

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/**'
      - 'package.json'
      - '.github/workflows/publish-on-main.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-github-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@RUTUJEKWIELKI'

      - name: Install
        run: npm install

      - name: Build (dependency order)
        run: |
          set -e
          for dir in \
            packages/@RUTUJEKWIELKI/util \
            packages/@RUTUJEKWIELKI/collection \
            packages/@RUTUJEKWIELKI/formatters \
            packages/@RUTUJEKWIELKI/builders \
            packages/@RUTUJEKWIELKI/rest \
            packages/@RUTUJEKWIELKI/ws \
            packages/strafebot
          do
            echo "Building $dir"
            (cd "$dir" && npx tsc -p tsconfig.json)
          done

      - name: Configure npm for GitHub Packages
        run: |
          echo "@RUTUJEKWIELKI:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          echo "always-auth=true" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish packages (skip existing versions)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          publish_one() {
            local dir="$1"
            echo "::group::publish $dir"
            (cd "$dir" && npm publish --access public)
            local code=$?
            if [ $code -ne 0 ]; then
              echo "publish skipped or failed for $dir (exit $code)"
            fi
            echo "::endgroup::"
          }
          publish_one packages/@RUTUJEKWIELKI/util
          publish_one packages/@RUTUJEKWIELKI/collection
          publish_one packages/@RUTUJEKWIELKI/formatters
          publish_one packages/@RUTUJEKWIELKI/builders
          publish_one packages/@RUTUJEKWIELKI/rest
          publish_one packages/@RUTUJEKWIELKI/ws
          publish_one packages/strafebot
          publish_one packages/create-strafe-bot
