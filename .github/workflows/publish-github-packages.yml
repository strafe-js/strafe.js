name: Publish GitHub Packages

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@strafe-js'

      - name: Install
        run: npm install

      - name: Build (dependency order)
        run: |
          set -e
          for dir in \
            packages/@strafe-js/util \
            packages/@strafe-js/collection \
            packages/@strafe-js/formatters \
            packages/@strafe-js/builders \
            packages/@strafe-js/rest \
            packages/@strafe-js/ws \
            packages/strafebot
          do
            echo "Building $dir"
            (cd "$dir" && npx tsc -p tsconfig.json)
          done

      - name: Configure npm for GitHub Packages
        run: |
          echo "@strafe-js:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          echo "always-auth=true" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @strafe-js/util
        working-directory: packages/@strafe-js/util
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @strafe-js/collection
        working-directory: packages/@strafe-js/collection
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @strafe-js/formatters
        working-directory: packages/@strafe-js/formatters
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @strafe-js/builders
        working-directory: packages/@strafe-js/builders
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @strafe-js/rest
        working-directory: packages/@strafe-js/rest
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @strafe-js/ws
        working-directory: packages/@strafe-js/ws
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @strafe-js/strafebot
        working-directory: packages/strafebot
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish create-strafebot
        working-directory: packages/create-strafe-bot
        run: npm publish --access public
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish packages to npmjs.org (when NPM_TOKEN is configured)
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          echo "@strafe-js:registry=https://registry.npmjs.org" > .npmrc
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
          for dir in \
            packages/@strafe-js/util \
            packages/@strafe-js/collection \
            packages/@strafe-js/formatters \
            packages/@strafe-js/builders \
            packages/@strafe-js/rest \
            packages/@strafe-js/ws \
            packages/strafebot \
            packages/create-strafe-bot
          do
            (cd "$dir" && npm publish --registry https://registry.npmjs.org --access public) || true
          done
