name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install

      - name: Build (dependency order)
        run: |
          set -e
          for dir in \
            packages/@strafe-js/util \
            packages/@strafe-js/collection \
            packages/@strafe-js/formatters \
            packages/@strafe-js/builders \
            packages/@strafe-js/rest \
            packages/@strafe-js/ws \
            packages/strafebot
          do
            echo "Building $dir"
            (cd "$dir" && npx tsc -p tsconfig.json)
          done
